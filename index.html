const FIXOS_SEMANA=[
  {label:"Aluguel",valor:565},{label:"Contador",valor:210},{label:"Sistema",valor:210},

const fmt=(v)=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const num=(v)=>Number(v||0);
const calcBonus=(p)=>{if(p<600)return 0;return 75+Math.floor((p-600)/100)*25;};
function calcComprar(item,estoque){
  const diff=Math.max(0,num(item.min)-num(estoque));
  if(diff===0)return 0;
  return Math.ceil(diff/num(item.fator));
}

const css=`
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--sur:#181c27;--sur2:#1e2333;--bor:#2a2f42;--acc:#f0c040;--acc2:#3ecf8e;--acc3:#e05c5c;--txt:#e8eaf0;--mut:#7a8099;--fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;--r:12px}
body{background:var(--bg);color:var(--txt);font-family:var(--fb);font-size:14px;min-height:100vh}
.app{max-width:1140px;margin:0 auto;padding:20px 14px 60px}
.hdr{display:flex;align-items:center;gap:14px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--bor)}
.logo{width:42px;height:42px;background:var(--acc);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:800;font-size:16px;color:var(--bg)}
.ttl{font-family:var(--fh);font-size:19px;font-weight:800}
.sub{font-size:11px;color:var(--mut);margin-top:2px}
.sp{flex:1}
.tabs{display:flex;gap:3px;margin-bottom:20px;background:var(--sur);padding:4px;border-radius:var(--r);flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:9px;border:none;background:transparent;color:var(--mut);font-family:var(--fb);font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap}
.tab.on{background:var(--acc);color:var(--bg);font-weight:700}
.tab:hover:not(.on){color:var(--txt);background:var(--sur2)}
.card{background:var(--sur);border:1px solid var(--bor);border-radius:var(--r);padding:16px;margin-bottom:12px}
.ctit{font-family:var(--fh);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--acc);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.g2{grid-template-columns:1fr}}
label{display:block;font-size:11px;color:var(--mut);margin-bottom:3px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
input,select{width:100%;background:var(--sur2);border:1px solid var(--bor);border-radius:7px;padding:8px 10px;color:var(--txt);font-family:var(--fb);font-size:13px}
input:focus,select:focus{outline:none;border-color:var(--acc)}
.btn{padding:9px 16px;border-radius:7px;border:none;font-family:var(--fb);font-weight:600;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.bp{background:var(--acc);color:var(--bg)}.bg{background:var(--sur2);color:var(--txt);border:1px solid var(--bor)}.bd{background:var(--acc3);color:#fff}.bs{background:var(--acc2);color:var(--bg)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10px;color:var(--mut);font-weight:600;text-transform:uppercase;padding:7px 8px;border-bottom:1px solid var(--bor)}
td{padding:6px 8px;border-bottom:1px solid var(--bor);font-size:12px}
tr:last-child td{border-bottom:none}
.bdg{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.bg2{background:#1a3d2e;color:var(--acc2)}.br{background:#3d1a1a;color:var(--acc3)}.by{background:#3d3000;color:var(--acc)}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.st{background:var(--sur2);border-radius:var(--r);padding:12px;border:1px solid var(--bor)}
.sl{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.sv{font-family:var(--fh);font-size:18px;font-weight:800}
.gn{color:var(--acc2)}.rd{color:var(--acc3)}.yw{color:var(--acc)}
.sbox{background:linear-gradient(135deg,#1a2e1a,#0f1f17);border:2px solid var(--acc2);border-radius:var(--r);padding:20px;text-align:center;margin-bottom:12px}
.slb{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.svl{font-family:var(--fh);font-size:36px;font-weight:800;margin:6px 0}
.smt{font-size:11px;color:var(--mut)}
.fc{background:var(--sur2);border:1px solid var(--bor);border-radius:var(--r);padding:14px;margin-bottom:9px}
.fn{font-family:var(--fh);font-size:13px;font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ff{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.ft{margin-top:10px;padding-top:10px;border-top:1px solid var(--bor);display:flex;justify-content:space-between;align-items:center}
.fv{font-family:var(--fh);font-size:18px;font-weight:800;color:var(--acc2)}
.wb{background:var(--sur2);border:1px solid var(--bor);border-radius:7px;padding:10px;margin-top:8px;white-space:pre-wrap;font-size:11px;font-family:monospace}
.cb{font-weight:700;color:var(--acc3)}.cz{color:var(--mut)}
.lod{text-align:center;padding:40px;color:var(--mut)}
.tst{position:fixed;bottom:20px;right:20px;background:var(--acc2);color:var(--bg);padding:10px 18px;border-radius:9px;font-weight:700;font-size:12px;z-index:999}
.rf{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sml{font-size:11px!important;padding:6px 10px!important}
.inp-s{width:70px!important;font-size:11px!important;padding:4px 6px!important}
.tag{font-size:10px;color:var(--acc2);margin-top:2px}
.ni{background:var(--sur2);border:1px solid var(--bor);border-radius:var(--r);padding:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
`;

function Toast({msg}){if(!msg)return null;return <div className="tst">✓ {msg}</div>;}

function MoneyRow({label,value,onSave,oculto,cor,indent}){
  const [editing,setEditing]=useState(false);
  const [raw,setRaw]=useState("");
  const startEdit=()=>{setRaw(num(value)||"");setEditing(true);};
  const endEdit=()=>{setEditing(false);onSave(raw);};
  return(
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"4px 0"}}>
      <div style={{fontSize:12,color:"var(--mut)",paddingLeft:indent?16:0}}>{label}</div>
      {editing?(
        <input type="number" autoFocus style={{width:120,fontSize:12,padding:"3px 8px",background:"var(--sur2)",border:"1px solid var(--acc)",borderRadius:6,color:"var(--txt)",textAlign:"right"}}
          value={raw} onChange={e=>setRaw(e.target.value)} onBlur={endEdit} onKeyDown={e=>e.key==="Enter"&&endEdit()}/>
      ):(
        <div onClick={startEdit} style={{width:120,fontSize:12,padding:"3px 8px",background:"var(--sur2)",border:"1px solid var(--bor)",borderRadius:6,color:cor?`var(--${cor})`:"var(--txt)",textAlign:"right",cursor:"pointer"}}>
          {oculto?"••••••":num(value)>0?fmt(value):<span style={{color:"var(--mut)"}}>R$ 0,00</span>}
        </div>
      )}
    </div>
  );
}

function App(){
  const [tab,setTab]=useState("fat");
  const [semanas,setSemanas]=useState([]);
  const [semanaId,setSemanaId]=useState(null);
  const [semana,setSemana]=useState(null);
  const [vales,setVales]=useState([]);
  const [folha,setFolha]=useState([]);
  const [contagem,setContagem]=useState({});
  const [fornecedores,setFornecedores]=useState({});
  const [funcionarios,setFuncionarios]=useState([]);
  const [loading,setLoading]=useState(true);
  const [toast,setToast]=useState("");
  const [novaSemana,setNovaSemana]=useState("");

  const showToast=(m)=>{setToast(m);setTimeout(()=>setToast(""),2500);};

  useEffect(()=>{initApp();},[]);

  const initApp=async()=>{
    const {data:fd}=await sb.from("fornecedores_config").select("*");
    if(fd&&fd.length>0){
      const obj={};
      fd.forEach(r=>{if(!obj[r.fornecedor])obj[r.fornecedor]=[];obj[r.fornecedor].push({nome:r.item,min:r.min,preco:r.preco,tipo:r.tipo||"un",fator:r.fator||1,unidade_compra:r.unidade_compra||"unidade",whatsapp:r.whatsapp});});
      setFornecedores(obj);
    }
    const {data:func}=await sb.from("funcionarios_config").select("*").order("ordem");
    if(func&&func.length>0)setFuncionarios(func);
    await carregarSemanas();
  };

  const carregarSemanas=async()=>{
    const {data}=await sb.from("semanas").select("*").order("created_at",{ascending:false});
    setSemanas(data||[]);
    if(data&&data.length>0)setSemanaId(prev=>prev||data[0].id);
    else setLoading(false);
  };

  useEffect(()=>{if(semanaId&&Object.keys(fornecedores).length>0)carregarDados();},[semanaId]);

  const carregarDados=async()=>{
    setLoading(true);
    const [s,v,f,ct]=await Promise.all([
      sb.from("semanas").select("*").eq("id",semanaId).single(),
      sb.from("vales").select("*").eq("semana_id",semanaId).order("created_at",{ascending:false}),
      sb.from("folha").select("*").eq("semana_id",semanaId),
      sb.from("contagem").select("*").eq("semana_id",semanaId),
    ]);
    setSemana(s.data);setVales(v.data||[]);setFolha(f.data||[]);
    const obj={};
    (ct.data||[]).forEach(r=>{if(!obj[r.fornecedor])obj[r.fornecedor]={};obj[r.fornecedor][r.item]=r.estoque;});
    setContagem(obj);setLoading(false);
  };

  const criarSemana=async()=>{
    if(!novaSemana.trim())return;
    const {data}=await sb.from("semanas").insert({periodo:novaSemana}).select().single();
    if(data){showToast("Semana criada!");setNovaSemana("");await carregarSemanas();setSemanaId(data.id);}
  };

  const fatSmash=()=>num(semana?.receita_smash);
  const fatClassic=()=>num(semana?.receita_classic);
  const fatGrupo=()=>fatSmash()+fatClassic();
  const repasse=()=>num(semana?.repasse);
  const imposto=()=>fatGrupo()*0.06;

  const calcComprasForn=()=>{
    const totais={};
    Object.entries(fornecedores).forEach(([forn,itens])=>{
      const ct=contagem[forn]||{};
      let total=0;
      itens.forEach(item=>{total+=calcComprar(item,ct[item.nome]||0)*num(item.preco);});
      totais[forn]=total;
    });
    return totais;
  };
  const totalCompras=()=>Object.values(calcComprasForn()).reduce((a,v)=>a+v,0);
  const totalFixos=()=>FIXOS_SEMANA.reduce((a,f)=>a+f.valor,0);

  const calcFolhaFunc=(fid)=>{
    const fd=folha.find(f=>f.funcionario_id===fid);
    const func=funcionarios.find(f=>f.id===fid);
    if(!fd||!func)return{base:0,comissao:0,bonus:0,descAtraso:0,liquido:0};
    const base=num(fd.dias)*num(func.valor_dia);
    const comissao=func.comissao?num(fd.pedidos_comissao)*0.40:0;
    const bonus=func.comissao?0:calcBonus(num(fd.pedidos_bonus));
    const descAtraso=(num(func.valor_dia)/6/60)*num(fd.minutos_atraso||0);
    return{base,comissao,bonus,descAtraso,liquido:base+comissao+bonus+num(fd.vale_transporte)-num(fd.desconto)-descAtraso};
  };
  const totalFolha=()=>funcionarios.reduce((a,f)=>a+calcFolhaFunc(f.id).liquido,0);
  const totalContasPagar=()=>imposto()+totalCompras()+totalFolha()+totalFixos();
  const saldo=()=>repasse()-imposto()-totalCompras()-totalFixos()-totalFolha();

  const updateSemana=async(field,value)=>{
    const {error}=await sb.from("semanas").update({[field]:Number(value)}).eq("id",semanaId);
    if(error)showToast("Erro ao salvar!");
    else{setSemana(prev=>({...prev,[field]:Number(value)}));showToast("Salvo!");}
  };
  const updateFolha=async(fid,field,value)=>{
    const func=funcionarios.find(f=>f.id===fid);
    const existing=folha.find(f=>f.funcionario_id===fid);
    if(existing){
      await sb.from("folha").update({[field]:value}).eq("id",existing.id);
      setFolha(prev=>prev.map(f=>f.funcionario_id===fid?{...f,[field]:value}:f));
    } else {
      const {data}=await sb.from("folha").insert({semana_id:semanaId,funcionario_id:fid,funcionario_nome:func.nome,[field]:value}).select().single();
      if(data)setFolha(prev=>[...prev,data]);
    }
  };
  const updateContagem=async(fornecedor,item,estoque)=>{
    setContagem(prev=>({...prev,[fornecedor]:{...(prev[fornecedor]||{}),[item]:estoque}}));
    await sb.from("contagem").upsert({semana_id:semanaId,fornecedor,item,estoque:Number(estoque)},{onConflict:"semana_id,fornecedor,item"});
  };
  const updateItem=async(fornecedor,itemNome,field,value)=>{
    setFornecedores(prev=>{const n={...prev};n[fornecedor]=n[fornecedor].map(i=>i.nome===itemNome?{...i,[field]:value}:i);return n;});
    const parsed=(field==="preco"||field==="min"||field==="fator")?Number(value):value;
    await sb.from("fornecedores_config").update({[field]:parsed}).eq("fornecedor",fornecedor).eq("item",itemNome);
    showToast("Salvo!");
  };
  const updateFuncionario=async(fid,field,value)=>{
    setFuncionarios(prev=>prev.map(f=>f.id===fid?{...f,[field]:value}:f));
    await sb.from("funcionarios_config").update({[field]:value}).eq("id",fid);
  };
  const lancarVale=async(vale)=>{
    const {data}=await sb.from("vales").insert({semana_id:semanaId,...vale}).select().single();
    if(data){
      setVales(prev=>[data,...prev]);
      const fd=folha.find(f=>f.funcionario_id===vale.funcionario_id);
      await updateFolha(vale.funcionario_id,"desconto",num(fd?.desconto)+num(vale.valor));
      showToast("Vale registrado!");
    }
  };
  const removerVale=async(id)=>{
    await sb.from("vales").delete().eq("id",id);
    setVales(prev=>prev.filter(v=>v.id!==id));
    showToast("Vale removido");
  };
  const adicionarFuncionario=async(func)=>{
    const id=func.nome.toLowerCase().replace(/\s+/g,"_").replace(/[^a-z0-9_]/g,"")+"_"+Date.now();
    const proxOrdem=funcionarios.length>0?Math.max(...funcionarios.map(f=>f.ordem||0))+1:1;
    const {data}=await sb.from("funcionarios_config").insert({id,nome:func.nome,valor_dia:func.valor_dia,comissao:func.comissao,ordem:proxOrdem}).select().single();
    if(data)setFuncionarios(prev=>[...prev,data]);
    showToast(`${func.nome} adicionado!`);
  };
  const removerFuncionario=async(fid)=>{
    await sb.from("funcionarios_config").delete().eq("id",fid);
    setFuncionarios(prev=>prev.filter(f=>f.id!==fid));
    showToast("Funcionário removido");
  };
  const adicionarFornecedor=async(nome)=>{
    if(!nome.trim()||fornecedores[nome])return;
    setFornecedores(prev=>({...prev,[nome]:[]}));
    showToast(`${nome} adicionado!`);
  };
  const adicionarItem=async(fornecedor,item)=>{
    if(!item.nome.trim())return;
    await sb.from("fornecedores_config").insert({fornecedor,item:item.nome,min:item.min||0,preco:item.preco||0,tipo:item.tipo||"un",fator:item.fator||1,unidade_compra:item.unidade_compra||"unidade"});
    setFornecedores(prev=>({...prev,[fornecedor]:[...(prev[fornecedor]||[]),item]}));
    showToast("Item adicionado!");
  };
  const gerarPedido=(fornecedor)=>{
    const itens=fornecedores[fornecedor]||[];
    const ct=contagem[fornecedor]||{};
    const linhas=itens.map(i=>{const comp=calcComprar(i,ct[i.nome]||0);return comp>0?`• ${i.nome}: *${comp} ${i.unidade_compra}*`:null;}).filter(Boolean);
    if(!linhas.length)return null;
    return `Olá, tudo bem? Esse é meu pedido para a semana:\n\n${linhas.join("\n")}\n\nObrigado! 🤙`;
  };

  const TABS=[
    {id:"fat",label:"📊 Faturamento"},
    {id:"indicadores",label:"📈 Indicadores"},
    {id:"est",label:"📦 Estoque"},
    {id:"folha",label:"👥 Folha"},
    {id:"vales",label:"💸 Vales"},
    {id:"ponto",label:"🕐 Ponto"},
    {id:"agente",label:"⚡ Sonic IA"},
    {id:"cfg",label:"⚙️ Config"},
  ];

  return(
    <>
      <style>{css}</style>
      <Toast msg={toast}/>
      <div className="app">
        <div className="hdr">
          <div className="logo">SY</div>
          <div><div className="ttl">Smash You — Gestão</div><div className="sub">Controle semanal · Folha · Estoque</div></div>
          <div className="sp"/>
          <span className="bdg bg2">● Online</span>
        </div>
        <div className="card" style={{marginBottom:14}}>
          <div className="rf">
            <div style={{flex:1}}>
              <label>Semana ativa</label>
              <select value={semanaId||""} onChange={e=>setSemanaId(e.target.value)}>
                {semanas.map(s=><option key={s.id} value={s.id}>{s.periodo||`Semana ${new Date(s.created_at).toLocaleDateString("pt-BR")}`}</option>)}
              </select>
            </div>
            <div style={{flex:1}}>
              <label>Nova semana</label>
              <div className="rf" style={{gap:6}}>
                <input type="text" placeholder="Ex: 19/05 a 25/05" value={novaSemana} onChange={e=>setNovaSemana(e.target.value)} onKeyDown={e=>e.key==="Enter"&&criarSemana()}/>
                <button className="btn bp" onClick={criarSemana}>+</button>
              </div>
            </div>
          </div>
        </div>
        <div className="tabs">{TABS.map(t=><button key={t.id} className={`tab${tab===t.id?" on":""}`} onClick={()=>{setTab(t.id);if(t.id==="folha")carregarDados();}}>{t.label}</button>)}</div>
        {loading?<div className="lod">Carregando...</div>:!semanaId?<div className="lod">Crie uma semana para começar ☝️</div>:(
          <>
            {tab==="fat"&&<TabFaturamento semana={semana} updateSemana={updateSemana} fatSmash={fatSmash} fatClassic={fatClassic} fatGrupo={fatGrupo} repasse={repasse} imposto={imposto} totalCompras={totalCompras} totalFolha={totalFolha} totalFixos={totalFixos} saldo={saldo} totalContasPagar={totalContasPagar} comprasForn={calcComprasForn()} fornecedores={fornecedores}/>}
            {tab==="indicadores"&&<TabIndicadores semanas={semanas} sb={sb}/>}
            {tab==="est"&&<TabEstoque fornecedores={fornecedores} contagem={contagem} updateContagem={updateContagem} updateItem={updateItem} gerarPedido={gerarPedido} showToast={showToast} adicionarItem={adicionarItem} comprasForn={calcComprasForn()}/>}
            {tab==="folha"&&<TabFolha folha={folha} updateFolha={updateFolha} calcFolhaFunc={calcFolhaFunc} totalFolha={totalFolha} funcionarios={funcionarios} updateFuncionario={updateFuncionario}/>}
            {tab==="vales"&&<TabVales vales={vales} lancarVale={lancarVale} removerVale={removerVale} funcionarios={funcionarios}/>}
            {tab==="ponto"&&<TabPonto semanaId={semanaId} funcionarios={funcionarios} sb={sb}/>}
            {tab==="agente"&&<TabAgente semanas={semanas} semana={semana} funcionarios={funcionarios} fatGrupo={fatGrupo} repasse={repasse} imposto={imposto} saldo={saldo} totalCompras={totalCompras} totalFolha={totalFolha} totalFixos={totalFixos}/>}
            {tab==="cfg"&&<TabConfig fornecedores={fornecedores} adicionarFornecedor={adicionarFornecedor} adicionarItem={adicionarItem} updateItem={updateItem} funcionarios={funcionarios} updateFuncionario={updateFuncionario} adicionarFuncionario={adicionarFuncionario} removerFuncionario={removerFuncionario} sb={sb}/>}
          </>
        )}
      </div>
    </>
  );
}

function TabPonto({semanaId,funcionarios,sb}){
  const [registros,setRegistros]=useState([]);
  const [loading,setLoading]=useState(true);
  const ENTRADA_H=17,ENTRADA_M=0,SAIDA_H=23,SAIDA_M=20,INT_MAX=20;
  const toMin=(h,m)=>h*60+m;
  const diffMin=(t1,t2)=>Math.round((new Date(t2)-new Date(t1))/60000);
  const fmtHora=(ts)=>{const d=new Date(ts);return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;};
  const fmtData=(ts)=>{const d=new Date(ts);return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`;};

  useEffect(()=>{if(semanaId)carregar();},[semanaId]);
  const carregar=async()=>{
    setLoading(true);
    const {data}=await sb.from("ponto").select("*").eq("semana_id",semanaId).order("horario",{ascending:true});
    setRegistros(data||[]);setLoading(false);
  };
  const calcSaldo=(regs)=>{
    let s=0;const pd={};
    regs.forEach(r=>{const d=new Date(r.horario).toDateString();if(!pd[d])pd[d]=[];pd[d].push(r);});
    Object.values(pd).forEach(dia=>{
      const ent=dia.find(r=>r.tipo==="entrada");
      const si=dia.find(r=>r.tipo==="saida_intervalo");
      const vi=dia.find(r=>r.tipo==="volta_intervalo");
      const sai=dia.find(r=>r.tipo==="saida");
      if(ent){const d=new Date(ent.horario);s+=toMin(ENTRADA_H,ENTRADA_M)-toMin(d.getHours(),d.getMinutes());}
      if(si&&vi){const dur=diffMin(si.horario,vi.horario);s-=Math.max(0,dur-INT_MAX);}
      if(sai){const d=new Date(sai.horario);s+=toMin(d.getHours(),d.getMinutes())-toMin(SAIDA_H,SAIDA_M);}
    });
    return s;
  };
  const tipoLabel={entrada:"Entrada",saida_intervalo:"Saída int.",volta_intervalo:"Volta int.",saida:"Saída"};
  if(loading)return <div className="lod">Carregando ponto...</div>;
  const porFunc={};
  registros.forEach(r=>{if(!porFunc[r.funcionario_id])porFunc[r.funcionario_id]={nome:r.funcionario_nome,regs:[]};porFunc[r.funcionario_id].regs.push(r);});
  const totalAtrasos=Object.values(porFunc).reduce((a,f)=>{const s=calcSaldo(f.regs);return a+(s<0?Math.abs(s):0);},0);
  const totalCreditos=Object.values(porFunc).reduce((a,f)=>{const s=calcSaldo(f.regs);return a+(s>0?s:0);},0);
  return(
    <div>
      <div className="sg" style={{marginBottom:16}}>
        <div className="st"><div className="sl">Total registros</div><div className="sv yw">{registros.length}</div></div>
        <div className="st"><div className="sl">Min. de atraso</div><div className="sv rd">{totalAtrasos} min</div></div>
        <div className="st"><div className="sl">Min. de crédito</div><div className="sv gn">{totalCreditos} min</div></div>
      </div>
      {funcionarios.map(func=>{
        const fd=porFunc[func.id];const regs=fd?.regs||[];const saldo=calcSaldo(regs);
        const pd={};regs.forEach(r=>{const d=new Date(r.horario).toDateString();if(!pd[d])pd[d]=[];pd[d].push(r);});
        return(
          <div className="card" key={func.id} style={{marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <div style={{fontFamily:"var(--fh)",fontSize:14,fontWeight:700}}>👤 {func.nome}</div>
              <div style={{display:"flex",gap:8}}>
                {regs.length===0&&<span className="bdg" style={{background:"var(--sur2)",color:"var(--mut)"}}>Sem registros</span>}
                {saldo>0&&<span className="bdg bg2">+{saldo} min crédito</span>}
                {saldo<0&&<span className="bdg br">{Math.abs(saldo)} min atraso</span>}
                {saldo===0&&regs.length>0&&<span className="bdg bg2">No horário ✓</span>}
              </div>
            </div>
            {Object.entries(pd).map(([dia,dregs])=>{
              const ent=dregs.find(r=>r.tipo==="entrada");
              const si=dregs.find(r=>r.tipo==="saida_intervalo");
              const vi=dregs.find(r=>r.tipo==="volta_intervalo");
              const sai=dregs.find(r=>r.tipo==="saida");
              let atrEnt=0,excInt=0,saiAnt=0,credEnt=0,credSai=0;
              if(ent){const d=new Date(ent.horario);const diff=toMin(ENTRADA_H,ENTRADA_M)-toMin(d.getHours(),d.getMinutes());if(diff<0)atrEnt=Math.abs(diff);else credEnt=diff;}
              if(si&&vi){const dur=diffMin(si.horario,vi.horario);if(dur>INT_MAX)excInt=dur-INT_MAX;}
              if(sai){const d=new Date(sai.horario);const diff=toMin(d.getHours(),d.getMinutes())-toMin(SAIDA_H,SAIDA_M);if(diff<0)saiAnt=Math.abs(diff);else credSai=diff;}
              return(
                <div key={dia} style={{marginBottom:10,background:"var(--sur2)",borderRadius:8,padding:10}}>
                  <div style={{fontSize:11,color:"var(--mut)",fontWeight:700,marginBottom:8}}>📅 {fmtData(dregs[0].horario)}</div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(100px,1fr))",gap:6,marginBottom:8}}>
                    {dregs.map(r=>(
                      <div key={r.id} style={{textAlign:"center",padding:"6px 4px",background:"var(--sur)",borderRadius:6}}>
                        <div style={{fontSize:10,color:"var(--mut)",marginBottom:2}}>{tipoLabel[r.tipo]||r.tipo}</div>
                        <div style={{fontSize:13,fontWeight:700}}>{fmtHora(r.horario)}</div>
                      </div>
                    ))}
                  </div>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    {atrEnt>0&&<span className="bdg br">Atraso: {atrEnt} min</span>}
                    {credEnt>0&&<span className="bdg bg2">Adiantado: {credEnt} min</span>}
                    {excInt>0&&<span className="bdg br">Intervalo +{excInt} min</span>}
                    {saiAnt>0&&<span className="bdg br">Saída antec.: {saiAnt} min</span>}
                    {credSai>0&&<span className="bdg bg2">Hora extra: {credSai} min</span>}
                    {atrEnt===0&&excInt===0&&saiAnt===0&&ent&&<span className="bdg bg2">✓ OK</span>}
                  </div>
                </div>
              );
            })}
          </div>
        );
      })}
      <button className="btn bg" style={{marginTop:8}} onClick={carregar}>🔄 Atualizar</button>
    </div>
  );
}

function TabIndicadores({semanas,sb}){
  const [filtro,setFiltro]=useState("semanal");
  const [semId,setSemId]=useState(semanas[0]?.id||"");
  const [mes,setMes]=useState("");
  const [dados,setDados]=useState(null);
  const [loading,setLoading]=useState(false);
  const EXCLUIR=["Caixa Mix Embalagens","Vermello Embalagens","Coca-Cola"];

  useEffect(()=>{calcular();},[semId,filtro,mes]);

  const calcular=async()=>{
    setLoading(true);
    let sems=filtro==="semanal"?semanas.filter(s=>s.id===semId):semanas.slice(0,4);
    if(!sems.length){setDados(null);setLoading(false);return;}
    const ids=sems.map(s=>s.id);
    const [cr,fr]=await Promise.all([
      sb.from("compras").select("*").in("semana_id",ids),
      sb.from("folha").select("*").in("semana_id",ids),
    ]);
    const fatBruto=sems.reduce((a,s)=>a+num(s.receita_smash)+num(s.receita_classic),0);
    const repasse=sems.reduce((a,s)=>a+num(s.repasse),0);
    const imposto=fatBruto*0.06;
    const fixos=FIXOS_SEMANA.reduce((a,f)=>a+f.valor,0)*sems.length;
    const cmv=(cr.data||[]).filter(c=>!EXCLUIR.includes(c.fornecedor)).reduce((a,c)=>a+num(c.valor),0);
    const folhaTotal=(fr.data||[]).reduce((a,f)=>a+num(f.dias)*(num(f.valor_dia)||105)+num(f.pedidos_comissao||0)*0.40+calcBonus(num(f.pedidos_bonus||0))-num(f.desconto||0),0);
    const lucroLiq=repasse-imposto-cmv-folhaTotal-fixos;
    const cmvPerc=repasse>0?(cmv/repasse)*100:0;
    const cmoPerc=repasse>0?(folhaTotal/repasse)*100:0;
    const lucroPerc=repasse>0?(lucroLiq/repasse)*100:0;
    setDados({fatBruto,fatSmash:sems.reduce((a,s)=>a+num(s.receita_smash),0),fatClassic:sems.reduce((a,s)=>a+num(s.receita_classic),0),repasse,imposto,cmv,cmvPerc,folhaTotal,cmoPerc,fixos,lucroLiq,lucroPerc,margemContrib:repasse-cmv,pe:fixos+folhaTotal,n:sems.length});
    setLoading(false);
  };

  const Ind=({label,valor,perc,cor,desc})=>(
    <div className="st" style={{borderLeft:`3px solid var(--${cor||"bor"})`}}>
      <div className="sl">{label}</div>
      <div style={{fontFamily:"var(--fh)",fontSize:14,fontWeight:800,color:`var(--${cor==="acc2"?"acc2":cor==="acc3"?"acc3":"acc"})`,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{fmt(valor)}</div>
      {perc!==undefined&&<div style={{fontSize:10,color:"var(--mut)",marginTop:2}}>{perc.toFixed(1)}% da receita</div>}
      {desc&&<div style={{fontSize:10,color:"var(--mut)",marginTop:2}}>{desc}</div>}
    </div>
  );

  return(
    <div>
      <div className="card" style={{marginBottom:14}}>
        <div className="ctit">🔍 Filtro</div>
        <div className="rf" style={{gap:8,marginBottom:12}}>
          {["semanal","mensal"].map(f=>(
            <button key={f} className={`btn ${filtro===f?"bp":"bg"}`} style={{fontSize:12}} onClick={()=>setFiltro(f)}>
              {f==="semanal"?"📅 Semanal":"📆 Mensal"}
            </button>
          ))}
        </div>
        {filtro==="semanal"&&<div><label>Semana</label>
          <select value={semId} onChange={e=>setSemId(e.target.value)}>
            {semanas.map(s=><option key={s.id} value={s.id}>{s.periodo||`Semana ${new Date(s.created_at).toLocaleDateString("pt-BR")}`}</option>)}
          </select>
        </div>}
        {filtro==="mensal"&&<div><label>Mês</label><input type="month" value={mes} onChange={e=>setMes(e.target.value)}/></div>}
      </div>
      {loading&&<div className="lod">Calculando...</div>}
      {dados&&<>
        <div className="card"><div className="ctit">💰 Faturamento — {dados.n} semana{dados.n>1?"s":""}</div>
          <div className="sg">
            <Ind label="Faturamento Bruto" valor={dados.fatBruto} cor="yw"/>
            <Ind label="Smash You" valor={dados.fatSmash} cor="yw"/>
            <Ind label="Classic Burger" valor={dados.fatClassic} cor="yw"/>
            <Ind label="Receita (Repasse)" valor={dados.repasse} cor="acc2"/>
          </div>
        </div>
        <div className="card"><div className="ctit">📊 Custos e Margens</div>
          <div className="sg">
            <Ind label="CMV (insumos)" valor={dados.cmv} perc={dados.cmvPerc} cor="acc3"/>
            <Ind label="CMO (folha)" valor={dados.folhaTotal} perc={dados.cmoPerc} cor="acc3"/>
            <Ind label="Custos Fixos" valor={dados.fixos} cor="acc3"/>
            <Ind label="Imposto (6%)" valor={dados.imposto} cor="acc3"/>
            <Ind label="Margem Contribuição" valor={dados.margemContrib} cor="acc2" desc="Receita − CMV"/>
            <Ind label="Lucro Líquido" valor={dados.lucroLiq} perc={dados.lucroPerc} cor={dados.lucroLiq>=0?"acc2":"acc3"}/>
          </div>
        </div>
        <div className="card"><div className="ctit">🎯 Ponto de Equilíbrio</div>
          <div className="sg">
            <Ind label="Ponto de Equilíbrio" valor={dados.pe} cor="yw" desc="Fixos + Folha"/>
            <div className="st"><div className="sl">Status</div>
              <div className={`sv ${dados.repasse>=dados.pe?"gn":"rd"}`}>{dados.repasse>=dados.pe?"✅ Acima do PE":"⚠️ Abaixo do PE"}</div>
            </div>
          </div>
        </div>
      </>}
    </div>
  );
}

function TabAgente({semanas,semana,funcionarios,fatGrupo,repasse,imposto,saldo,totalCompras,totalFolha,totalFixos}){
  const [msgs,setMsgs]=useState([{role:"assistant",content:"⚡ Olá Matheus! Sou o Sonic IA. Tenho acesso a todos os dados da ferramenta e histórico do Saipos. Como posso ajudar?"}]);

GRUPO: 8.960 pedidos, R$512.953. Pico: 19h todos os dias.`;

  const ctx=`Você é o Sonic IA, assistente do Smash You Burger em Campinas. Responda em português, direto e prático.
Semana atual (${semana?.periodo||"não definida"}): Fat.Bruto R$${fatGrupo().toFixed(2)}, Repasse R$${repasse().toFixed(2)}, Imposto R$${imposto().toFixed(2)}, Compras R$${totalCompras().toFixed(2)}, Folha R$${totalFolha().toFixed(2)}, Fixos R$${totalFixos().toFixed(2)}, Saldo R$${saldo().toFixed(2)}, Meta R$3000.

${pdfTexto?`PDF ANEXADO: ${pdfTexto}`:""}`;

      setMsgs(prev=>[...prev,{role:"assistant",content:"Erro ao conectar. Tente novamente."}]);

  return(

        <div style={{display:"flex",alignItems:"center",gap:12}}>

          <div>
            <div style={{fontFamily:"var(--fh)",fontSize:16,fontWeight:800,color:"var(--acc)"}}>Sonic IA</div>

            {pdfTexto&&<div style={{fontSize:10,color:"var(--acc2)",marginTop:2}}>✓ PDF carregado</div>}
          </div>
        </div>
      </div>
      <div className="card" style={{minHeight:380,display:"flex",flexDirection:"column"}}>

          {msgs.map((m,i)=>(

          {loading&&<div style={{display:"flex",justifyContent:"flex-start"}}><div style={{background:"var(--sur2)",padding:"10px 14px",borderRadius:12,fontSize:13,color:"var(--mut)"}}>⚡ Sonic digitando...</div></div>}
        </div>
        <div className="rf" style={{gap:8}}>
          <input type="text" value={input} placeholder="Pergunte sobre vendas, faturamento, canais..." style={{flex:1}} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&enviar()}/>

          <button key={s} className="btn bg" style={{fontSize:11}} onClick={()=>setInput(s)}>{s}</button>
        ))}

    </div>
  );

        {Object.entries(fornecedores).filter(([f])=>!fornSel||f===fornSel).map(([forn,itens])=>(
          <div key={forn} style={{marginBottom:20}}>
            <div style={{fontFamily:"var(--fh)",fontSize:13,fontWeight:700,color:"var(--acc)",padding:"8px 0 6px",borderBottom:"1px solid var(--bor)",marginBottom:8,display:"flex",alignItems:"center",gap:8}}>
              🏪 {forn}<span className="bdg by">{itens.length} itens</span>
            </div>
            <table>
              <thead><tr><th>Item</th><th style={{width:50,textAlign:"center"}}>Tipo</th><th style={{width:65,textAlign:"center"}}>Mínimo</th><th style={{width:55,textAlign:"center"}}>Fator</th><th style={{width:100}}>Embalagem</th><th style={{width:85,textAlign:"right"}}>Preço (R$)</th></tr></thead>
              <tbody>
                {itens.map(item=>(
                  <tr key={item.nome}>
                    <td style={{fontWeight:500}}>{item.nome}</td>
                    <td style={{textAlign:"center"}}><span className={`bdg ${item.tipo==="peso"?"by":"bg2"}`}>{item.tipo==="peso"?"g":"un"}</span></td>
                    <td><input type="number" min={0} className="inp-s" style={{textAlign:"center"}} defaultValue={item.min} onBlur={e=>updateItem(forn,item.nome,"min",e.target.value)}/></td>
                    <td><input type="number" min={1} className="inp-s" style={{textAlign:"center"}} defaultValue={item.fator} onBlur={e=>updateItem(forn,item.nome,"fator",e.target.value)}/></td>
                    <td><input type="text" className="inp-s" defaultValue={item.unidade_compra} onBlur={e=>updateItem(forn,item.nome,"unidade_compra",e.target.value)}/></td>
                    <td><input type="number" min={0} step="0.01" className="inp-s" style={{textAlign:"right"}} defaultValue={item.preco||""} placeholder="0,00" onBlur={e=>updateItem(forn,item.nome,"preco",e.target.value)}/></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
