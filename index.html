// Calcula unidades a comprar com base no tipo e fator
function calcComprar(item, estoque) {
  const diff = Math.max(0, num(item.min) - num(estoque));
  if (diff === 0) return 0;
  return Math.ceil(diff / num(item.fator));
}

  const carregarSemanas=async()=>{
    const {data}=await sb.from("semanas").select("*").order("created_at",{ascending:false});

    setLoading(true);

      sb.from("semanas").select("*").eq("id",semanaId).single(),
      sb.from("vales").select("*").eq("semana_id",semanaId).order("created_at",{ascending:false}),
      sb.from("folha").select("*").eq("semana_id",semanaId),
      sb.from("contagem").select("*").eq("semana_id",semanaId),
    ]);
    setSemana(s.data); setVales(v.data||[]); setFolha(f.data||[]);

  const repasse   = ()=>num(semana?.repasse);

    const totais={};

      const ct=contagem[forn]||{};
      let total=0;
      itens.forEach(item=>{
        const comp=calcComprar(item,ct[item.nome]||0);
        total+=comp*num(item.preco);
      });
      totais[forn]=total;
    });
    return totais;

  const calcFolhaFunc=(fid)=>{
    const fd=folha.find(f=>f.funcionario_id===fid);
    const func=funcionarios.find(f=>f.id===fid);
    if(!fd||!func)return{base:0,comissao:0,bonus:0,descAtraso:0,liquido:0};
    const base=num(fd.dias)*num(func.valor_dia);
    const comissao=func.comissao?num(fd.pedidos_comissao)*0.40:0;
    const bonus=func.comissao?0:calcBonus(num(fd.pedidos_bonus));
    const descAtraso=(num(func.valor_dia)/6/60)*num(fd.minutos_atraso||0);
    return{base,comissao,bonus,descAtraso,liquido:base+comissao+bonus+num(fd.vale_transporte)-num(fd.desconto)-descAtraso};
  };
  const totalFolha=()=>funcionarios.reduce((a,f)=>a+calcFolhaFunc(f.id).liquido,0);
  const totalContasPagar=()=>imposto()+totalCompras()+totalFolha()+totalFixos();
  const saldo=()=>repasse()-imposto()-totalCompras()-totalFixos()-totalFolha();

  // UPDATES
  const updateSemana=async(field,value)=>{
    const {error}=await sb.from("semanas").update({[field]:Number(value)}).eq("id",semanaId);
    if(error){console.error("Erro ao salvar semana:",error);showToast("Erro ao salvar!");}
    else{setSemana(prev=>({...prev,[field]:Number(value)}));showToast("Salvo!");}
  };
  const updateFolha=async(fid,field,value)=>{
    const func=funcionarios.find(f=>f.id===fid);
    const existing=folha.find(f=>f.funcionario_id===fid);
    if(existing){
      await sb.from("folha").update({[field]:value}).eq("id",existing.id);
      setFolha(prev=>prev.map(f=>f.funcionario_id===fid?{...f,[field]:value}:f));
    } else {
      const {data}=await sb.from("folha").insert({semana_id:semanaId,funcionario_id:fid,funcionario_nome:func.nome,[field]:value}).select().single();
      if(data)setFolha(prev=>[...prev,data]);
    }
  };
  const updateContagem=async(fornecedor,item,estoque)=>{
    setContagem(prev=>({...prev,[fornecedor]:{...(prev[fornecedor]||{}),[item]:estoque}}));
    const {error}=await sb.from("contagem").upsert({semana_id:semanaId,fornecedor,item,estoque:Number(estoque)},{onConflict:"semana_id,fornecedor,item"});
    if(error)console.error("Erro contagem:",error);
  };
  const updateItem=async(fornecedor,itemNome,field,value)=>{
    setFornecedores(prev=>{
      const n={...prev};
      n[fornecedor]=n[fornecedor].map(i=>i.nome===itemNome?{...i,[field]:value}:i);
      return n;
    });
    const parsed = (field==="preco"||field==="min"||field==="fator") ? Number(value) : value;
    const {error}=await sb.from("fornecedores_config").update({[field]:parsed}).eq("fornecedor",fornecedor).eq("item",itemNome);
    if(error){console.error("Erro updateItem:",error);showToast("Erro ao salvar item!");}
    else showToast("Preço salvo!");
  };
  const updateFuncionario=async(fid,field,value)=>{
    setFuncionarios(prev=>prev.map(f=>f.id===fid?{...f,[field]:value}:f));
    await sb.from("funcionarios_config").update({[field]:value}).eq("id",fid);
  };
  const lancarVale=async(vale)=>{
    const {data}=await sb.from("vales").insert({semana_id:semanaId,...vale}).select().single();
    if(data){
      setVales(prev=>[data,...prev]);
      const fd=folha.find(f=>f.funcionario_id===vale.funcionario_id);
      await updateFolha(vale.funcionario_id,"desconto",num(fd?.desconto)+num(vale.valor));
      showToast("Vale registrado!");
    }
  };
  const removerVale=async(id)=>{
    await sb.from("vales").delete().eq("id",id);
    setVales(prev=>prev.filter(v=>v.id!==id));
    showToast("Vale removido");
  };
  const adicionarFuncionario=async(func)=>{
    const id=func.nome.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'')+'_'+Date.now();
    const proxOrdem=funcionarios.length>0?Math.max(...funcionarios.map(f=>f.ordem||0))+1:1;
    const {data}=await sb.from("funcionarios_config").insert({id,nome:func.nome,valor_dia:func.valor_dia,comissao:func.comissao,ordem:proxOrdem}).select().single();
    if(data)setFuncionarios(prev=>[...prev,data]);
    showToast(`${func.nome} adicionado!`);
  };
  const removerFuncionario=async(fid)=>{
    await sb.from("funcionarios_config").delete().eq("id",fid);
    setFuncionarios(prev=>prev.filter(f=>f.id!==fid));
    showToast("Funcionário removido");
  };
  const adicionarFornecedor=async(nome)=>{
    if(!nome.trim()||fornecedores[nome])return;
    setFornecedores(prev=>({...prev,[nome]:[]}));
    showToast(`Fornecedor ${nome} adicionado!`);
  };
  const adicionarItem=async(fornecedor,item)=>{
    if(!item.nome.trim())return;
    await sb.from("fornecedores_config").insert({fornecedor,item:item.nome,min:item.min||0,preco:item.preco||0,tipo:item.tipo||"un",fator:item.fator||1,unidade_compra:item.unidade_compra||"unidade"});
    setFornecedores(prev=>({...prev,[fornecedor]:[...(prev[fornecedor]||[]),item]}));
    showToast("Item adicionado!");
  };
  const gerarPedido=(fornecedor)=>{
    const itens=fornecedores[fornecedor]||[];
    const ct=contagem[fornecedor]||{};
    const linhas=itens.map(i=>{
      const comp=calcComprar(i,ct[i.nome]||0);
      return comp>0?`• ${i.nome}: *${comp} ${i.unidade_compra}*`:null;
    }).filter(Boolean);
    if(!linhas.length)return null;
    return `Olá! Pedido Smash You — ${new Date().toLocaleDateString("pt-BR")}\n\n${linhas.join("\n")}\n\nObrigado! 🤙`;
  };

  const TABS=[
    {id:"fat",        label:"📊 Faturamento"},
    {id:"indicadores",label:"📈 Indicadores"},
    {id:"est",        label:"📦 Estoque"},
    {id:"folha",      label:"👥 Folha"},
    {id:"vales",      label:"💸 Vales"},
    {id:"ponto",      label:"🕐 Ponto"},
    {id:"agente",     label:"⚡ Sonic IA"},
    {id:"cfg",        label:"⚙️ Config"},
  ];

  return(
    <>
      <style>{css}</style>
      <Toast msg={toast}/>
      <div className="app">
        <div className="hdr">
          <div className="logo">SY</div>
          <div><div className="ttl">Smash You — Gestão</div><div className="sub">Controle semanal · Folha · Estoque</div></div>
          <div className="sp"/>
          <span className="bdg bg2">● Online</span>
        </div>

        <div className="card" style={{marginBottom:14}}>
          <div className="rf">
            <div style={{flex:1}}>
              <label>Semana ativa</label>
              <select value={semanaId||""} onChange={e=>setSemanaId(e.target.value)}>
                {semanas.map(s=><option key={s.id} value={s.id}>{s.periodo||`Semana ${new Date(s.created_at).toLocaleDateString("pt-BR")}`}</option>)}
              </select>
            </div>
            <div style={{flex:1}}>
              <label>Nova semana</label>
              <div className="rf" style={{gap:6}}>
                <input type="text" placeholder="Ex: 19/05 a 25/05" value={novaSemana} onChange={e=>setNovaSemana(e.target.value)} onKeyDown={e=>e.key==="Enter"&&criarSemana()}/>
                <button className="btn bp" onClick={criarSemana}>+</button>
              </div>
            </div>
          </div>
        </div>

        <div className="tabs">{TABS.map(t=><button key={t.id} className={`tab${tab===t.id?" on":""}`} onClick={()=>{setTab(t.id);if(t.id==="folha")carregarDados();}
}>{t.label}</button>)}</div>

        {loading?<div className="lod">Carregando...</div>:!semanaId?<div className="lod">Crie uma semana para começar ☝️</div>:(
          <>
            {tab==="fat"        &&<TabFaturamento semana={semana} updateSemana={updateSemana} fatSmash={fatSmash} fatClassic={fatClassic} fatGrupo={fatGrupo} repasse={repasse} imposto={imposto} totalCompras={totalCompras} totalFolha={totalFolha} totalFixos={totalFixos} saldo={saldo} totalContasPagar={totalContasPagar} comprasForn={calcComprasForn()} fornecedores={fornecedores}/>}
            {tab==="est"        &&<TabEstoque fornecedores={fornecedores} contagem={contagem} updateContagem={updateContagem} updateItem={updateItem} gerarPedido={gerarPedido} showToast={showToast} adicionarItem={adicionarItem} comprasForn={calcComprasForn()} semanaId={semanaId}/>}
            {tab==="folha"      &&<TabFolha folha={folha} updateFolha={updateFolha} calcFolhaFunc={calcFolhaFunc} totalFolha={totalFolha} funcionarios={funcionarios} updateFuncionario={updateFuncionario}/>}
            {tab==="vales"      &&<TabVales vales={vales} lancarVale={lancarVale} removerVale={removerVale} funcionarios={funcionarios}/>}
            {tab==="ponto"      &&<TabPonto semanaId={semanaId} funcionarios={funcionarios} sb={sb}/>}
            {tab==="indicadores"&&<TabIndicadores semanas={semanas} sb={sb}/>}
            {tab==="agente"     &&<TabAgente semanas={semanas} semana={semana} semanaId={semanaId} folha={folha} fornecedores={fornecedores} funcionarios={funcionarios} fatGrupo={fatGrupo} repasse={repasse} imposto={imposto} saldo={saldo} totalCompras={totalCompras} totalFolha={totalFolha} totalFixos={totalFixos}/>}
            {tab==="cfg"        &&<TabConfig fornecedores={fornecedores} adicionarFornecedor={adicionarFornecedor} adicionarItem={adicionarItem} updateItem={updateItem} funcionarios={funcionarios} updateFuncionario={updateFuncionario} adicionarFuncionario={adicionarFuncionario} removerFuncionario={removerFuncionario} sb={sb}/>}
          </>
        )}
      </div>
    </>
  );
}

// Componente de input monetário formatado
function MoneyRow({label, value, onSave, oculto, cor, indent}){
  const [editing, setEditing] = useState(false);
  const [raw, setRaw] = useState("");
  const startEdit = () => { setRaw(num(value)||""); setEditing(true); };
  const endEdit = () => { setEditing(false); onSave(raw); };
  return(
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"4px 0"}}>
      <div style={{fontSize:12,color:"var(--mut)",paddingLeft:indent?16:0}}>{label}</div>
      {editing?(
        <input type="number" autoFocus style={{width:120,fontSize:12,padding:"3px 8px",background:"var(--sur2)",border:"1px solid var(--acc)",borderRadius:6,color:"var(--txt)",textAlign:"right"}}
          value={raw} onChange={e=>setRaw(e.target.value)} onBlur={endEdit} onKeyDown={e=>e.key==="Enter"&&endEdit()}/>
      ):(
        <div onClick={startEdit} style={{width:120,fontSize:12,padding:"3px 8px",background:"var(--sur2)",border:"1px solid var(--bor)",borderRadius:6,color:cor?`var(--${cor})`:"var(--txt)",textAlign:"right",cursor:"pointer",userSelect:"none"}}>
          {oculto?"••••••":num(value)>0?fmt(value):<span style={{color:"var(--mut)"}}>R$ 0,00</span>}
        </div>
      )}
    </div>
  );
}

// ── TAB FATURAMENTO ───────────────────────────────────────────────────────────
function TabFaturamento({semana,updateSemana,fatSmash,fatClassic,fatGrupo,repasse,imposto,totalCompras,totalFolha,totalFixos,saldo,totalContasPagar,comprasForn,fornecedores}){
  const [oculto,setOculto]=useState(true);
  const s=saldo(); const meta=3000; const pct=Math.min(100,Math.max(0,(s/meta)*100));
  const cor=s>=meta?"gn":s>=0?"yw":"rd";
  const show=(v)=>oculto?"••••••":fmt(v);

  // Linha DRE
  const DRERow=({label,valor,bold,cor,indent,sep})=>(
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:`${sep?"10px 0 4px":"4px 0"}`,borderTop:sep?"1px solid var(--bor)":"none",marginTop:sep?"6px":"0"}}>
      <div style={{fontSize:12,fontWeight:bold?700:400,color:indent?"var(--mut)":"var(--txt)",paddingLeft:indent?16:0}}>{label}</div>
      <div style={{fontSize:12,fontWeight:bold?700:400,color:`var(--${cor||"txt"})`}}>{show(valor)}</div>
    </div>
  );

  return(
    <div>
      <div className="rf" style={{marginBottom:12,justifyContent:"flex-end"}}>
        <button className="btn bg sml" onClick={()=>setOculto(o=>!o)}>{oculto?"👁 Revelar":"🙈 Ocultar"}</button>
      </div>

      <div className="sbox">
        <div className="slb">Saldo / Sua retirada</div>
        <div className={`svl ${cor}`}>{oculto?"R$ ••••••":fmt(s)}</div>
        <div className="smt">Meta: {oculto?"R$ ••••••":fmt(meta)} — {oculto?"••":pct.toFixed(0)}% atingido</div>
        <div style={{background:"#0f1f17",borderRadius:20,height:5,marginTop:8,overflow:"hidden"}}>
          <div style={{background:s>=meta?"var(--acc2)":s>=0?"var(--acc)":"var(--acc3)",width:oculto?"0%":`${pct}%`,height:"100%",borderRadius:20,transition:"width .4s"}}/>
        </div>
      </div>

      <div className="g2">
        {/* DRE */}
        <div className="card">
          <div className="ctit">📊 Resultado da Semana</div>

          {[["receita_smash","Faturamento Smash You"],["receita_classic","Faturamento Classic Burger"]].map(([k,l])=>(
            <MoneyRow key={k} label={l} value={semana?.[k]||0} onSave={v=>updateSemana(k,v)} oculto={oculto}/>
          ))}
          <DRERow label="Faturamento do Grupo" valor={fatGrupo()} bold cor="acc2" sep/>
          <MoneyRow label="Repasse recebido das plataformas" value={semana?.repasse||0} onSave={v=>updateSemana("repasse",v)} oculto={oculto} cor="acc2" indent/>
          <DRERow label="(-) Imposto (6%)" valor={imposto()} indent cor="acc3"/>
          <DRERow label="(-) Compras" valor={totalCompras()} indent cor="acc3" sep/>
          <DRERow label="(-) Folha" valor={totalFolha()} indent cor="acc3"/>
          <DRERow label="(-) Fixos" valor={totalFixos()} indent cor="acc3"/>
          <div style={{marginTop:10,padding:"8px 10px",background:"#3d1a1a",borderRadius:8,border:"1px solid var(--acc3)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontSize:11,fontWeight:700,color:"var(--acc3)"}}>📋 Total Contas a Pagar</div>
              <div style={{fontSize:9,color:"var(--mut)",marginTop:2}}>Imposto + Compras + Folha + Fixos</div>
            </div>
            <div style={{fontSize:15,fontWeight:800,color:"var(--acc3)"}}>{oculto?"••••••":fmt(totalContasPagar())}</div>
          </div>
          <DRERow label="= Saldo / Retirada" valor={saldo()} bold cor={saldo()>=3000?"acc2":saldo()>=0?"acc":"acc3"} sep/>
        </div>

        {/* Detalhes */}
        <div>
          <div className="card">
            <div className="ctit">🛒 Compras por fornecedor</div>
            {Object.keys(fornecedores).map(f=>(
              <div key={f} style={{display:"flex",justifyContent:"space-between",padding:"3px 0",fontSize:12}}>
                <span style={{color:"var(--mut)"}}>{f}</span>
                <span style={{fontWeight:600,color:"var(--acc)"}}>{fmt(comprasForn[f]||0)}</span>
              </div>
            ))}
            <div style={{display:"flex",justifyContent:"space-between",padding:"6px 0 0",borderTop:"1px solid var(--bor)",marginTop:6,fontSize:12,fontWeight:700}}>
              <span>Total estimado</span>
              <span style={{color:"var(--acc)"}}>{fmt(totalCompras())}</span>
            </div>
          </div>
          <div className="card">
            <div className="ctit">🔒 Fixos da semana</div>
            {FIXOS_SEMANA.map(f=>(
              <div key={f.label} style={{display:"flex",justifyContent:"space-between",padding:"3px 0",fontSize:12}}>
                <span style={{color:"var(--mut)"}}>{f.label}</span>
                <span>{fmt(f.valor)}</span>
              </div>
            ))}
            <div style={{display:"flex",justifyContent:"space-between",padding:"6px 0 0",borderTop:"1px solid var(--bor)",marginTop:6,fontSize:12,fontWeight:700}}>
              <span>Total</span>
              <span style={{color:"var(--acc)"}}>{fmt(totalFixos())}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── TAB ESTOQUE ───────────────────────────────────────────────────────────────
function TabEstoque({fornecedores,contagem,updateContagem,updateItem,gerarPedido,showToast,adicionarItem,comprasForn,semanaId}){
  const [open,setOpen]=useState(null);
  const [copiado,setCopiado]=useState(null);
  const [subTab,setSubTab]=useState("semanal");
  const [comprasDiarias,setComprasDiarias]=useState([]);
  const [whatsapps,setWhatsapps]=useState({});

  useEffect(()=>{carregarWhatsapps();if(subTab==="diaria")carregarComprasDiarias();},[subTab]);

  const carregarWhatsapps=async()=>{
    const {data}=await window._sb?.from("fornecedores_config").select("fornecedor,whatsapp")||{data:[]};
    const obj={};(data||[]).forEach(r=>{if(r.whatsapp)obj[r.fornecedor]=r.whatsapp;});
    setWhatsapps(obj);
  };

  const carregarComprasDiarias=async()=>{
    const hoje=new Date().toISOString().split('T')[0];
    const {data}=await window._sb?.from("contagem_diaria").select("*").eq("data",hoje)||{data:[]};
    setComprasDiarias(data||[]);
  };

  const abrirWhatsapp=(forn)=>{
    const num=whatsapps[forn];
    if(!num){showToast("Cadastre o WhatsApp desse fornecedor na aba Config!");return;}
    const pedido=gerarPedido(forn);
    if(!pedido){showToast("Nenhum item a pedir para esse fornecedor!");return;}
    const linhas=pedido.split('\n').slice(2,-1).join('\n');
    const msg=encodeURIComponent(`Olá, tudo bem? Esse é meu pedido para a semana:\n\n${linhas}`);
    window.open(`https://wa.me/${num}?text=${msg}`,'_blank');
  };

  const copiar=(f)=>{
    const txt=gerarPedido(f);
    if(txt){navigator.clipboard.writeText(txt);setCopiado(f);setTimeout(()=>setCopiado(null),2000);showToast("Pedido copiado!");}
  };

  return(
    <div>
      {/* SUB TABS */}
      <div style={{display:"flex",gap:6,marginBottom:16}}>
        <button className={`btn ${subTab==="semanal"?"bp":"bg"}`} style={{fontSize:12}} onClick={()=>setSubTab("semanal")}>📦 Estoque Semanal</button>
        <button className={`btn ${subTab==="diaria"?"bp":"bg"}`} style={{fontSize:12}} onClick={()=>setSubTab("diaria")}>🛒 Compras Diárias</button>
      </div>

      {subTab==="diaria"&&(
        <div>
          <div className="card" style={{marginBottom:12}}>
            <div className="ctit">🛒 Compras Diárias — {new Date().toLocaleDateString("pt-BR")}</div>
            {comprasDiarias.length===0?(
              <div style={{color:"var(--mut)",fontSize:13}}>Nenhuma contagem diária registrada hoje. Preencha pelo app de contagem.</div>
            ):(
              <table>
                <thead><tr><th>Item</th><th style={{textAlign:"center"}}>Quantidade</th><th>Tipo</th></tr></thead>
                <tbody>
                  {comprasDiarias.map(c=>(
                    <tr key={c.id}>
                      <td>{c.item}</td>
                      <td style={{textAlign:"center",fontWeight:700,color:"var(--acc)"}}>{c.quantidade}{c.tipo_item==="peso"?"g":""}</td>
                      <td><span className="bdg by">{c.tipo_item==="peso"?"peso":"unidade"}</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
            <button className="btn bg" style={{marginTop:10,fontSize:12}} onClick={carregarComprasDiarias}>🔄 Atualizar</button>
          </div>
        </div>
      )}

      {subTab==="semanal"&&Object.entries(fornecedores).map(([forn,itens])=>{
        const ct=contagem[forn]||{};
        const pedido=gerarPedido(forn);
        const pendentes=itens.filter(i=>calcComprar(i,ct[i.nome]||0)>0).length;
        const totalForn=comprasForn[forn]||0;
        const temWhats=!!whatsapps[forn];
        return(
          <div className="card" key={forn} style={{marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}} onClick={()=>setOpen(open===forn?null:forn)}>
              <div className="ctit" style={{margin:0}}>
                🏪 {forn}
                {pendentes>0&&<span className="bdg br">{pendentes} itens</span>}
                {totalForn>0&&<span className="bdg by">{fmt(totalForn)}</span>}
              </div>
              <div className="rf" style={{gap:6}}>
                {pedido&&(
                  <>
                    <button className={`btn sml ${temWhats?"bs":"bg"}`}
                      onClick={e=>{e.stopPropagation();abrirWhatsapp(forn);}}>
                      {temWhats?"📱 Fazer Pedido":"📱 Sem número"}
                    </button>
                    <button className={`btn sml ${copiado===forn?"bs":"bg"}`}
                      onClick={e=>{e.stopPropagation();copiar(forn);}}>
                      {copiado===forn?"✓ Copiado!":"📋 Copiar"}
                    </button>
                  </>
                )}
                <span style={{color:"var(--mut)"}}>{open===forn?"▲":"▼"}</span>
              </div>
            </div>

            {open===forn&&(
              <div style={{marginTop:12}}>
                <table>
                  <thead>
                    <tr>
                      <th>Item</th>
                      <th style={{width:80,textAlign:"center"}}>Estoque</th>
                      <th style={{width:75,textAlign:"center"}}>Mínimo</th>
                      <th style={{width:90,textAlign:"right"}}>Preço unit.</th>
                      <th style={{width:110,textAlign:"center"}}>Comprar</th>
                      <th style={{width:90,textAlign:"right"}}>Valor</th>
                    </tr>
                  </thead>
                  <tbody>
                    {itens.map(item=>{
                      const est=num(ct[item.nome]||0);
                      const comp=calcComprar(item,est);
                      const val=comp*num(item.preco);
                      const diff=Math.max(0,num(item.min)-est);
                      return(
                        <tr key={item.nome}>
                          <td>
                            <div>{item.nome}</div>
                            <div style={{fontSize:10,color:"var(--mut)"}}>{item.unidade_compra} · {item.tipo==="peso"?`${item.fator}g/un`:`${item.fator}un/cx`}</div>
                          </td>
                          <td>
                            <input type="number" min={0} className="inp-s" defaultValue={ct[item.nome]||""} placeholder="0" onBlur={e=>updateContagem(forn,item.nome,e.target.value)}/>
                            {item.tipo==="peso"&&<div style={{fontSize:9,color:"var(--mut)",textAlign:"center"}}>{est>=1000?(est/1000).toFixed(1)+"kg":est+"g"}</div>}
                          </td>
                          <td style={{textAlign:"center",fontSize:12,color:"var(--mut)"}}>{item.min}</td>
                          <td style={{textAlign:"right",fontSize:12,color:"var(--mut)"}}>{num(item.preco)>0?fmt(item.preco):"—"}</td>
                          <td style={{textAlign:"center"}}>
                            {comp>0
                              ?<div><span className="cb">▲ {comp}</span><div style={{fontSize:9,color:"var(--mut)"}}>{item.unidade_compra}</div><div style={{fontSize:9,color:"var(--acc3)"}}>{item.tipo==="peso"?`(${diff>=1000?(diff/1000).toFixed(1)+"kg":diff+"g"} faltando)`:`(${diff} un faltando)`}</div></div>
                              :<span className="cz">OK</span>}
                          </td>
                          <td style={{textAlign:"right",fontWeight:comp>0?700:400,color:comp>0?"var(--acc)":"var(--mut)"}}>{comp>0?fmt(val):"—"}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                {pedido&&<div className="wb">{pedido}</div>}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

}

// ── TAB PONTO ─────────────────────────────────────────────────────────────────
function TabPonto({semanaId, funcionarios, sb}){
  const [registros, setRegistros] = useState([]);
  const [loading, setLoading] = useState(true);

  const ENTRADA_H=17, ENTRADA_M=0, SAIDA_H=23, SAIDA_M=20, INT_MAX=20;
  const toMin=(h,m)=>h*60+m;
  const diffMin=(t1,t2)=>Math.round((new Date(t2)-new Date(t1))/60000);
  const fmtHora=(ts)=>{const d=new Date(ts);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
  const fmtData=(ts)=>{const d=new Date(ts);return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;};

  useEffect(()=>{if(semanaId)carregarPonto();},[semanaId]);

  const carregarPonto=async()=>{
    setLoading(true);
    const {data}=await sb.from('ponto').select('*').eq('semana_id',semanaId).order('horario',{ascending:true});
    setRegistros(data||[]);
    setLoading(false);
  };

  const calcSaldoFunc=(regs)=>{
    let saldo=0;
    const porDia={};
    regs.forEach(r=>{const dia=new Date(r.horario).toDateString();if(!porDia[dia])porDia[dia]=[];porDia[dia].push(r);});
    Object.values(porDia).forEach(dia=>{
      const entrada=dia.find(r=>r.tipo==='entrada');
      const saidaInt=dia.find(r=>r.tipo==='saida_intervalo');
      const voltaInt=dia.find(r=>r.tipo==='volta_intervalo');
      const saida=dia.find(r=>r.tipo==='saida');
      if(entrada){const d=new Date(entrada.horario);saldo+=toMin(ENTRADA_H,ENTRADA_M)-toMin(d.getHours(),d.getMinutes());}
      if(saidaInt&&voltaInt){const dur=diffMin(saidaInt.horario,voltaInt.horario);saldo-=Math.max(0,dur-INT_MAX);if(dur<INT_MAX)saldo+=INT_MAX-dur;}
      if(saida){const d=new Date(saida.horario);saldo+=toMin(d.getHours(),d.getMinutes())-toMin(SAIDA_H,SAIDA_M);}
    });
    return saldo;
  };

  const tipoLabel={entrada:'Entrada',saida_intervalo:'Saída int.',volta_intervalo:'Volta int.',saida:'Saída'};
  const tipoCor={entrada:'bg2',saida_intervalo:'by',volta_intervalo:'',saida:'br'};

  if(loading) return <div className="lod">Carregando ponto...</div>;

  // Agrupar por funcionário
  const porFunc={};
  registros.forEach(r=>{if(!porFunc[r.funcionario_id])porFunc[r.funcionario_id]={nome:r.funcionario_nome,regs:[]};porFunc[r.funcionario_id].regs.push(r);});

  // Totais gerais
  const totalAtrasos=Object.values(porFunc).reduce((a,f)=>{const s=calcSaldoFunc(f.regs);return a+(s<0?Math.abs(s):0);},0);
  const totalCreditos=Object.values(porFunc).reduce((a,f)=>{const s=calcSaldoFunc(f.regs);return a+(s>0?s:0);},0);

  return(
    <div>
      {/* Cards de resumo */}
      <div className="sg" style={{marginBottom:16}}>
        <div className="st"><div className="sl">Total registros</div><div className="sv yw">{registros.length}</div></div>
        <div className="st"><div className="sl">Min. de atraso (semana)</div><div className="sv rd">{totalAtrasos} min</div></div>
        <div className="st"><div className="sl">Min. de crédito (semana)</div><div className="sv gn">{totalCreditos} min</div></div>
      </div>

      {/* Relatório por funcionário */}
      {funcionarios.map(func=>{
        const fd=porFunc[func.id];
        const regs=fd?.regs||[];
        const saldo=calcSaldoFunc(regs);
        const porDia={};
        regs.forEach(r=>{const dia=new Date(r.horario).toDateString();if(!porDia[dia])porDia[dia]=[];porDia[dia].push(r);});

        return(
          <div className="card" key={func.id} style={{marginBottom:12}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
              <div style={{fontFamily:'var(--fh)',fontSize:14,fontWeight:700}}>👤 {func.nome}</div>
              <div style={{display:'flex',gap:8,alignItems:'center'}}>
                {regs.length===0&&<span className="bdg" style={{background:'var(--sur2)',color:'var(--mut)'}}>Sem registros</span>}
                {saldo>0&&<span className="bdg bg2">+{saldo} min crédito</span>}
                {saldo<0&&<span className="bdg br">{Math.abs(saldo)} min atraso</span>}
                {saldo===0&&regs.length>0&&<span className="bdg bg2">No horário ✓</span>}
              </div>
            </div>

            {Object.entries(porDia).length===0?(
              <div style={{color:'var(--mut)',fontSize:12}}>Nenhum registro essa semana.</div>
            ):(
              Object.entries(porDia).map(([dia,dregs])=>{
                const entrada=dregs.find(r=>r.tipo==='entrada');
                const saidaInt=dregs.find(r=>r.tipo==='saida_intervalo');
                const voltaInt=dregs.find(r=>r.tipo==='volta_intervalo');
                const saida=dregs.find(r=>r.tipo==='saida');

                let atrasoEntrada=0, excIntervalo=0, saidaAntecipada=0, creditoEntrada=0, creditoSaida=0;
                if(entrada){const d=new Date(entrada.horario);const diff=toMin(ENTRADA_H,ENTRADA_M)-toMin(d.getHours(),d.getMinutes());if(diff<0)atrasoEntrada=Math.abs(diff);else creditoEntrada=diff;}
                if(saidaInt&&voltaInt){const dur=diffMin(saidaInt.horario,voltaInt.horario);if(dur>INT_MAX)excIntervalo=dur-INT_MAX;}
                if(saida){const d=new Date(saida.horario);const diff=toMin(d.getHours(),d.getMinutes())-toMin(SAIDA_H,SAIDA_M);if(diff<0)saidaAntecipada=Math.abs(diff);else creditoSaida=diff;}

                return(
                  <div key={dia} style={{marginBottom:10,background:'var(--sur2)',borderRadius:8,padding:10}}>
                    <div style={{fontSize:11,color:'var(--mut)',fontWeight:700,marginBottom:8}}>
                      📅 {fmtData(dregs[0].horario)}
                    </div>
                    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(100px,1fr))',gap:6,marginBottom:8}}>
                      {dregs.map(r=>(
                        <div key={r.id} style={{textAlign:'center',padding:'6px 4px',background:'var(--sur)',borderRadius:6}}>
                          <div style={{fontSize:10,color:'var(--mut)',marginBottom:2}}>{tipoLabel[r.tipo]||r.tipo}</div>
                          <div style={{fontSize:13,fontWeight:700}}>{fmtHora(r.horario)}</div>
                        </div>
                      ))}
                    </div>
                    <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                      {atrasoEntrada>0&&<span className="bdg br">Atraso entrada: {atrasoEntrada} min</span>}
                      {creditoEntrada>0&&<span className="bdg bg2">Adiantado: {creditoEntrada} min</span>}
                      {excIntervalo>0&&<span className="bdg br">Intervalo excedido: {excIntervalo} min</span>}
                      {saidaAntecipada>0&&<span className="bdg br">Saída antecipada: {saidaAntecipada} min</span>}
                      {creditoSaida>0&&<span className="bdg bg2">Hora extra: {creditoSaida} min</span>}
                      {atrasoEntrada===0&&excIntervalo===0&&saidaAntecipada===0&&entrada&&<span className="bdg bg2">✓ Sem ocorrências</span>}
                    </div>
                  </div>
                );
              })
            )}
          </div>
        );
      })}

      <button className="btn bg" style={{marginTop:8}} onClick={carregarPonto}>🔄 Atualizar</button>
    </div>
  );
}

// ── TAB INDICADORES ───────────────────────────────────────────────────────────
function TabIndicadores({semanas,sb}){
  const [filtro,setFiltro]=useState("semanal");
  const [semanaId,setSemanaId]=useState(semanas[0]?.id||"");
  const [mes,setMes]=useState("");
  const [dataIni,setDataIni]=useState("");
  const [dataFim,setDataFim]=useState("");
  const [dados,setDados]=useState(null);
  const [loading,setLoading]=useState(false);
  const [pdfTexto,setPdfTexto]=useState("");

  const FORN_EXCLUIR=["Caixa Mix Embalagens","Vermello Embalagens","Coca-Cola"];

  useEffect(()=>{calcular();},[semanaId,filtro,mes,dataIni,dataFim]);

  const calcular=async()=>{
    setLoading(true);
    let semsFiltradas=[];
    if(filtro==="semanal"&&semanaId){
      semsFiltradas=semanas.filter(s=>s.id===semanaId);
    } else if(filtro==="mensal"&&mes){
      semsFiltradas=semanas.filter(s=>s.periodo&&s.periodo.includes(mes.split("-")[1]+"/"+mes.split("-")[0].slice(2)));
      if(!semsFiltradas.length) semsFiltradas=semanas.slice(0,4);
    } else if(filtro==="personalizado"&&dataIni&&dataFim){
      semsFiltradas=semanas;
    } else {
      semsFiltradas=semanas.slice(0,4);
    }
    if(!semsFiltradas.length){setDados(null);setLoading(false);return;}

    const ids=semsFiltradas.map(s=>s.id);
    const [comprasRes,folhaRes]=await Promise.all([
      sb.from("compras").select("*").in("semana_id",ids),
      sb.from("folha").select("*").in("semana_id",ids),
    ]);

    const fatBruto=semsFiltradas.reduce((a,s)=>a+num(s.receita_smash)+num(s.receita_classic),0);
    const fatSmash=semsFiltradas.reduce((a,s)=>a+num(s.receita_smash),0);
    const fatClassic=semsFiltradas.reduce((a,s)=>a+num(s.receita_classic),0);
    const repasse=semsFiltradas.reduce((a,s)=>a+num(s.repasse),0);
    const imposto=fatBruto*0.06;
    const fixos=FIXOS_SEMANA.reduce((a,f)=>a+f.valor,0)*semsFiltradas.length;
    const comprasTotal=(comprasRes.data||[]).reduce((a,c)=>a+num(c.valor),0);
    const cmv=(comprasRes.data||[]).filter(c=>!FORN_EXCLUIR.includes(c.fornecedor)).reduce((a,c)=>a+num(c.valor),0);
    const cmo=(folhaRes.data||[]).reduce((a,f)=>{
      const func=FIXOS_SEMANA; // placeholder
      return a+num(f.dias)*num(f.valor_dia||105)+num(f.pedidos_comissao||0)*0.40;
    },0);
    const folhaTotal=(folhaRes.data||[]).reduce((a,f)=>a+num(f.dias)*(num(f.valor_dia)||105)+num(f.pedidos_comissao||0)*0.40+calcBonus(num(f.pedidos_bonus||0))-num(f.desconto||0)-((num(f.valor_dia)||105)/6/60)*num(f.minutos_atraso||0),0);
    const lucroLiq=repasse-imposto-cmv-folhaTotal-fixos;
    const margemContrib=repasse-cmv;
    const pe=fixos+folhaTotal;
    const cmvPerc=repasse>0?(cmv/repasse)*100:0;
    const cmoPerc=repasse>0?(folhaTotal/repasse)*100:0;
    const fixosPerc=repasse>0?(fixos/repasse)*100:0;
    const lucroPerc=repasse>0?(lucroLiq/repasse)*100:0;

    setDados({fatBruto,fatSmash,fatClassic,repasse,imposto,cmv,cmvPerc,folhaTotal,cmoPerc,fixos,fixosPerc,lucroLiq,lucroPerc,margemContrib,pe,semanas:semsFiltradas.length});
    setLoading(false);
  };

  const Ind=({label,valor,perc,cor,desc})=>(
    <div className="st" style={{borderLeft:`3px solid var(--${cor||'bor'})`}}>
      <div className="sl">{label}</div>
      <div style={{fontFamily:"var(--fh)",fontSize:15,fontWeight:800,color:`var(--${cor==='acc2'?'acc2':cor==='acc3'?'acc3':'acc'})`,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{fmt(valor)}</div>
      {perc!==undefined&&<div style={{fontSize:10,color:'var(--mut)',marginTop:2}}>{perc.toFixed(1)}% da receita</div>}
      {desc&&<div style={{fontSize:10,color:'var(--mut)',marginTop:2}}>{desc}</div>}
    </div>
  );

  return(
    <div>
      {/* FILTROS */}
      <div className="card" style={{marginBottom:14}}>
        <div className="ctit">🔍 Filtro de período</div>
        <div className="rf" style={{gap:8,flexWrap:'wrap'}}>
          {["semanal","mensal","personalizado"].map(f=>(
            <button key={f} className={`btn ${filtro===f?'bp':'bg'}`} style={{fontSize:12}} onClick={()=>setFiltro(f)}>
              {f==="semanal"?"📅 Semanal":f==="mensal"?"📆 Mensal":"🗓️ Personalizado"}
            </button>
          ))}
        </div>
        <div style={{marginTop:12}}>
          {filtro==="semanal"&&(
            <div><label>Semana</label>
              <select value={semanaId} onChange={e=>setSemanaId(e.target.value)}>
                {semanas.map(s=><option key={s.id} value={s.id}>{s.periodo||`Semana ${new Date(s.created_at).toLocaleDateString("pt-BR")}`}</option>)}
              </select>
            </div>
          )}
          {filtro==="mensal"&&(
            <div><label>Mês</label><input type="month" value={mes} onChange={e=>setMes(e.target.value)}/></div>
          )}
          {filtro==="personalizado"&&(
            <div className="g2">
              <div><label>De</label><input type="date" value={dataIni} onChange={e=>setDataIni(e.target.value)}/></div>
              <div><label>Até</label><input type="date" value={dataFim} onChange={e=>setDataFim(e.target.value)}/></div>
            </div>
          )}
        </div>
      </div>

      {/* UPLOAD PDF */}
      <div className="card" style={{marginBottom:14}}>
        <div className="ctit">📄 Relatório ERP (PDF)</div>
        <input type="file" accept=".pdf,.txt,.csv" style={{marginBottom:8}}
          onChange={e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=ev=>setPdfTexto(ev.target.result.substring(0,2000));r.readAsText(f);}}}/>
        {pdfTexto&&<div style={{fontSize:11,color:'var(--mut)',background:'var(--sur2)',padding:10,borderRadius:8,maxHeight:100,overflow:'auto'}}>{pdfTexto.substring(0,300)}...</div>}
      </div>

      {loading&&<div className="lod">Calculando...</div>}
      {dados&&(
        <>
          <div className="card">
            <div className="ctit">💰 Faturamento — {dados.semanas} semana{dados.semanas>1?'s':''}</div>
            <div className="sg">
              <Ind label="Faturamento Bruto" valor={dados.fatBruto} cor="yw"/>
              <Ind label="Smash You" valor={dados.fatSmash} cor="yw"/>

function TabConfig({fornecedores,adicionarFornecedor,adicionarItem,updateItem,funcionarios,updateFuncionario,adicionarFuncionario,removerFuncionario,sb}){
  const [novoForn,setNovoForn]=useState("");
  const [novoItem,setNovoItem]=useState({forn:"",nome:"",min:0,preco:0,tipo:"un",fator:1,unidade_compra:"unidade"});
  const [novoFunc,setNovoFunc]=useState({nome:"",valor_dia:0,comissao:false});
  const [fornSelecionado,setFornSelecionado]=useState("");
  const [salvando,setSalvando]=useState({});
  const [usuarios,setUsuarios]=useState([]);
  const [novoUser,setNovoUser]=useState({nome:"",usuario:"",senha:"",perfil:"operador"});
  const [whatsapps,setWhatsapps]=useState({});

  useEffect(()=>{carregarUsuarios();carregarWhatsapps();},[]);

  const carregarUsuarios=async()=>{
    const {data}=await sb.from("usuarios").select("*").order("created_at");
    setUsuarios(data||[]);
  };
  const carregarWhatsapps=async()=>{
    const {data}=await sb.from("fornecedores_config").select("fornecedor,whatsapp");
    const obj={};
    (data||[]).forEach(r=>{if(r.whatsapp)obj[r.fornecedor]=r.whatsapp;});
    setWhatsapps(obj);
  };
  const salvarWhatsapp=async(forn,num)=>{
    setWhatsapps(p=>({...p,[forn]:num}));
    await sb.from("fornecedores_config").update({whatsapp:num}).eq("fornecedor",forn);
  };
  const adicionarUsuario=async()=>{
    if(!novoUser.nome||!novoUser.usuario||!novoUser.senha)return;
    await sb.from("usuarios").insert(novoUser);
    setNovoUser({nome:"",usuario:"",senha:"",perfil:"operador"});
    await carregarUsuarios();
  };
  const removerUsuario=async(id)=>{
    await sb.from("usuarios").delete().eq("id",id);
    await carregarUsuarios();
  };
  const atualizarUsuario=async(id,field,value)=>{
    await sb.from("usuarios").update({[field]:value}).eq("id",id);
    await carregarUsuarios();
  };

  return(
    <div>
      {/* FUNCIONÁRIOS */}
      <div className="card" style={{marginBottom:14}}>
        <div className="ctit">👥 Funcionários</div>
        <div style={{marginBottom:14}}>
          {funcionarios.map(f=>(
            <div key={f.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderBottom:"1px solid var(--bor)",flexWrap:"wrap"}}>
              <input type="text" style={{flex:1,minWidth:120,fontSize:13,fontWeight:600,background:"var(--sur2)",border:"1px solid var(--bor)",borderRadius:6,padding:"5px 8px",color:"var(--txt)"}}
                defaultValue={f.nome} onBlur={e=>updateFuncionario(f.id,"nome",e.target.value)}/>
              <div style={{display:"flex",alignItems:"center",gap:4,fontSize:12}}>
                <span style={{color:"var(--mut)"}}>R$</span>
                <input type="number" style={{width:70,fontSize:12,padding:"5px 7px",background:"var(--sur2)",border:"1px solid var(--bor)",borderRadius:6,color:"var(--acc2)"}}
                  defaultValue={f.valor_dia} onBlur={e=>updateFuncionario(f.id,"valor_dia",e.target.value)}/>
                <span style={{color:"var(--mut)"}}>/dia</span>
              </div>
              <label style={{display:"flex",alignItems:"center",gap:4,fontSize:12,color:"var(--mut)",textTransform:"none",letterSpacing:0}}>
                <input type="checkbox" defaultChecked={f.comissao} onChange={e=>updateFuncionario(f.id,"comissao",e.target.checked)}/>comissão
              </label>
              <button className="btn bd" style={{padding:"4px 10px",fontSize:11}} onClick={()=>removerFuncionario(f.id)}>✕</button>
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end"}}>
          <div style={{flex:2,minWidth:120}}><label>Nome</label><input type="text" value={novoFunc.nome} placeholder="Nome" onChange={e=>setNovoFunc(p=>({...p,nome:e.target.value}))}/></div>
          <div style={{flex:1,minWidth:80}}><label>R$/dia</label><input type="number" value={novoFunc.valor_dia} onChange={e=>setNovoFunc(p=>({...p,valor_dia:e.target.value}))}/></div>
          <div style={{flex:1,minWidth:80}}><label>Comissão?</label>
            <select value={novoFunc.comissao} onChange={e=>setNovoFunc(p=>({...p,comissao:e.target.value==="true"}))}>
              <option value="false">Não</option><option value="true">Sim</option>
            </select>
          </div>
          <button className="btn bp" onClick={async()=>{if(novoFunc.nome.trim()){await adicionarFuncionario(novoFunc);setNovoFunc({nome:"",valor_dia:0,comissao:false});}}}>+ Adicionar</button>
        </div>
      </div>

      {/* USUÁRIOS */}
      <div className="card" style={{marginBottom:14}}>
        <div className="ctit">🔐 Usuários (Contagem)</div>

        <div style={{marginBottom:12}}>
          {usuarios.map(u=>(

        <button className="btn bp" style={{marginTop:10,width:"100%"}} onClick={adicionarUsuario}>+ Adicionar usuário</button>

            </div>
            <table>
              <thead><tr><th>Item</th><th style={{width:50,textAlign:"center"}}>Tipo</th><th style={{width:65,textAlign:"center"}}>Mínimo</th><th style={{width:55,textAlign:"center"}}>Fator</th><th style={{width:100}}>Embalagem</th><th style={{width:85,textAlign:"right"}}>Preço (R$)</th></tr></thead>
              <tbody>
                {itens.map(item=>(
                  <tr key={item.nome}>
                    <td style={{fontWeight:500}}>{item.nome}</td>
                    <td style={{textAlign:"center"}}><span className={`bdg ${item.tipo==="peso"?"by":"bg2"}`}>{item.tipo==="peso"?"g":"un"}</span></td>
                    <td><input type="number" min={0} className="inp-s" style={{textAlign:"center"}} defaultValue={item.min} onBlur={e=>salvarPreco(forn,item.nome,"min",e.target.value)}/></td>
                    <td><input type="number" min={1} className="inp-s" style={{textAlign:"center"}} defaultValue={item.fator} onBlur={e=>salvarPreco(forn,item.nome,"fator",e.target.value)}/></td>
                    <td><input type="text" className="inp-s" defaultValue={item.unidade_compra} onBlur={e=>salvarPreco(forn,item.nome,"unidade_compra",e.target.value)}/></td>
                    <td><input type="number" min={0} step="0.01" className="inp-s" style={{textAlign:"right"}} defaultValue={item.preco||""} placeholder="0,00" onBlur={e=>salvarPreco(forn,item.nome,"preco",e.target.value)}/></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
